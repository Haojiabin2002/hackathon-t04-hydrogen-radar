- key: 中国政府采购网
  name: 中国政府采购网（ccgp.gov.cn）
  enabled: false
  kind: web
  quota: 0
  reason: '停用。实测直连返回 HTTP 403，需特定请求条件方可访问， 不做规避尝试。列为后续申请合规数据源的首选。

    '
- key: UNGM
  name: 联合国全球采购（ungm.org）
  enabled: false
  kind: web
  quota: 0
  reason: '备选，本期未实现。实测站点可达（HTTP 200），公告检索需会话态， 待海外线路验证充分后再评估。

    '
- key: 碳索氢能网
  name: 碳索氢能网（h2.solarbe.com）
  enabled: true
  kind: web
  quota: 15
  base: https://h2.solarbe.com
  lists:
  - https://h2.solarbe.com/
  article_pattern: /news/
  body_selectors:
  - article
  reason: 氢能垂直媒体，首页即公告流，实测53条氢能相关文章链接、正文容器可直取；更新快，与氢启未来、国际氢能网互为补充，可提高招标类信号的召回。
