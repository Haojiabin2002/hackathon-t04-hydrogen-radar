- key: 氢启未来
  name: 氢启未来（h2weilai.com）
  enabled: true
  kind: web
  quota: 40
  base: https://www.h2weilai.com
  lists:
  - https://www.h2weilai.com/cms/index/lists/catid/28.html
  - https://www.h2weilai.com/cms/index/lists/catid/29.html
  - https://www.h2weilai.com/cms/index/lists/catid/38.html
  - https://www.h2weilai.com/
  paginate:
    template: https://www.h2weilai.com/cms/index/lists/catid/28.html?page={p}
    pages:
    - 2
    - 12
  article_pattern: /shows/
  body_selectors:
  - div.conts
  reason: '氢能垂直门户，「市场动态」栏目集中转载中石化、国家能源集团等央国企的 招投标公告原文，且带发布时间；实测无人机验证、正文可直取、分页规整（300+ 页）， 是国内招标类信号密度最高的可爬源。

    '
- key: 国际氢能网
  name: 国际氢能网（h2.in-en.com）
  enabled: true
  kind: web
  quota: 30
  base: https://h2.in-en.com
  lists:
  - https://h2.in-en.com/
  - https://h2.in-en.com/zhiqing/
  - https://h2.in-en.com/rlqc/
  article_pattern: /html/h2-\d+\.shtml
  body_selectors:
  - div.conTextBox
  - div.content
  reason: '与氢启未来互补：更新更快（当日即发），且覆盖绿色甲醇/绿氨/氢冶金等 2026 年试点新增场景——这些正是氢璞老客户地图上没有的新买家类型。 站点自带 WAF SDK 但未触发拦截，实测列表
    151KB、详情 69KB 均为真实正文。

    '
- key: TED欧盟招标
  name: TED 欧盟公共采购（api.ted.europa.eu）
  enabled: true
  kind: ted_api
  overseas: true    # 海外源标记：看板的「海外」徽标与统计按这个字段算，不写死在代码里
  quota: 20
  queries:
  - label: 氢+燃料电池
    q: FT~("hydrogen") AND FT~("fuel cell")
  - label: 氢+电解槽
    q: FT~("hydrogen") AND FT~("electrolyser")
  - label: 氢+加氢
    q: FT~("hydrogen") AND FT~("refuelling")
  per_query: 25
  reason: '欧盟官方采购公告库，免密 API，响应自带采购方名称、国别与 官方采购联系邮箱（organisation-email-buyer）——海外线索的联系方式 因此有据可查而非编造。覆盖氢璞的海外机会（电解槽/电堆类标的）。

    '
