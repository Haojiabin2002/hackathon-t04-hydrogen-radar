# 氢璞创能产品知识库
# 来源：hackathon-t04/氢璞商机判断.txt 第四节「产品匹配矩阵」+ 产品单页参数
# 用途：任务3 产品匹配的检索底座。不得凭空新增未在规格中出现的型号。

products:
  - name: 兆瓦级电堆
    power_kw: 1000
    spec: 1MW / 1000 组电池
    scene: 大型储能电站
    customer_type: 氢储能项目方
    keywords: [储能, 电站, 调峰, 绿电, 制氢一体化]

  - name: 500kW级电堆
    power_kw: 500
    spec: 250-500kW
    scene: 超重型重卡 / 矿卡
    customer_type: 三一、徐工等工程机械与重卡整车厂
    keywords: [矿卡, 超重型, 自卸, 工程机械, 露天矿]

  - name: 300kW电堆（第六代 ST300VIC）
    power_kw: 300
    spec: 300kW 额定 / 340kW 峰值 / 30000h 设计寿命
    scene: 重卡 / 船舶
    customer_type: 系统集成商、船厂
    keywords: [重卡, 牵引车, 49吨, 干线物流, 船舶, 冷藏车]

  - name: OCEAN-200 船用系统
    power_kw: 200
    spec: 200kW / 已获中国船级社 CCS 型式认可
    scene: 内河船舶
    customer_type: 航运公司、船厂
    keywords: [船舶, 内河, 航运, 散货船, 港口, CCS]

  - name: 高铁380kW系统
    power_kw: 380
    spec: 续航 1000km+
    scene: 轨道交通
    customer_type: 高铁设计公司、轨交装备企业
    keywords: [轨道交通, 高铁, 有轨电车, 机车, 市域列车]

  - name: E200 车用系统
    power_kw: 200
    spec: 200kW 额定 / 210kW 峰值 / IP67 / 30000h
    scene: 重卡、物流车整车配套
    customer_type: 整车厂、系统集成商
    keywords: [物流车, 重卡, 环卫车, 牵引车, 整车配套]

  - name: 撬装式PEM制氢系统 CESP250/500/1000
    power_kw: null
    nm3_per_h_min: 250        # 单台产氢量下限
    nm3_per_h_max: 1000       # 单台产氢量上限；超出需多台并联，评分时按结构性劣势扣分
    spec: 250 / 500 / 1000 Nm³/h，纯度≥99.999%，直流电耗低至 4.1kWh/Nm³
    scene: 绿电制氢、加氢站现场制氢
    customer_type: 新能源电站业主、加氢站运营商、化工园区
    keywords: [制氢, 电解槽, 加氢站, 绿氢, PEM, 风光制氢]

  - name: 阴极封闭式空冷电堆 ST0D4A~ST2D2A
    power_kw: 2.2
    spec: 440W-2200W，无需外部冷却泵
    scene: 无人机、两轮车、通信备电、小型电站
    customer_type: 无人机厂商、两轮车企业、通信运营商
    keywords: [无人机, 两轮车, 助力自行车, 备用电源, 通信]

# 评分权重（任务书「我替领导拍的板」指定，可调）
scoring_weights:
  demand_certainty: 30   # 需求确定性：已招标/已中标/已签约 > 规划意向
  power_match: 25        # 功率匹配度：需求功率段是否落在产品谱系内
  customer_type: 25      # 客户类型：集成商/整车厂/终端用能企业契合度
  region_timing: 20      # 区域时机：示范城市群政策窗口、补贴周期

# 区域优先级参考（来源：五大示范城市群 2025H1 考核完成率）
region_priority:
  京津冀: {note: "6191辆已超额达标，存量运营复购为主", weight: 0.9}
  广东: {note: "完成率23%，收官放量压力最大", weight: 1.0}
  河北: {note: "完成率26%，放量压力大", weight: 1.0}
